<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>QuizGen AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1e2b;--mu:#6b7186;--bd:#e4e6ef;--pr:#6d5efc;--pr2:#8b5cf6;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1117;--card:#181b25;--tx:#eceef6;--mu:#9097ad;--bd:#2a2e3d}}
:root[data-theme=dark]{--bg:#0f1117;--card:#181b25;--tx:#eceef6;--mu:#9097ad;--bd:#2a2e3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--card);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:800;font-size:18px;padding:4px 10px 14px;background:linear-gradient(90deg,var(--pr),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border:0;background:none;color:var(--mu);text-align:left;width:100%}
.nav.on,.nav:hover{background:color-mix(in srgb,var(--pr) 12%,transparent);color:var(--pr)}
main{flex:1;min-width:0;padding:26px;max-width:1100px;margin:0 auto;width:100%}
h1{margin:0 0 4px;font-size:26px}h2{font-size:17px;margin:0 0 12px}.sub{color:var(--mu);margin:0 0 20px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.stat b{font-size:26px;display:block}.stat span{color:var(--mu);font-size:13px}
.btn{background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn.sec{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:6px 12px;font-size:13px}.btn:disabled{opacity:.4;cursor:default}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr)}
.badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.badge.w{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));transition:width .4s}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.drop{border:2px dashed var(--bd);border-radius:16px;padding:46px 20px;text-align:center;cursor:pointer}.drop:hover,.drop.over{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 6%,transparent)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:13px 16px;margin-bottom:10px}
.opt:hover{border-color:var(--pr)}.opt.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,transparent)}.opt.c{border-color:var(--ok)}.opt.x{border-color:var(--bad)}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;margin:0 6px 8px 0}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.nq{width:36px;height:36px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.nq.ans{background:var(--ok);color:#fff;border-color:var(--ok)}.nq.cur{outline:2px solid var(--pr)}.nq.rev{background:var(--warn);color:#fff;border-color:var(--warn)}
.hero{text-align:center;padding:50px 10px}.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.1}
.flow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:26px 0}.flow span{background:var(--card);border:1px solid var(--bd);padding:8px 16px;border-radius:99px}
.msg{padding:10px 14px;border-radius:14px;margin-bottom:10px;max-width:85%}.msg.u{background:var(--pr);color:#fff;margin-left:auto}.msg.a{background:var(--bg);border:1px solid var(--bd)}
input,select,textarea{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500;font-size:13px}
#toast{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:9}#toast.on{opacity:1}
nav.bot{display:none}
@media(max-width:800px){aside{display:none}main{padding:16px 14px 90px}nav.bot{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}nav.bot button{background:none;border:0;color:var(--mu);font-size:11px;padding:4px 8px}nav.bot button.on{color:var(--pr)}}
.sk{background:linear-gradient(90deg,var(--bd),transparent,var(--bd));background-size:200%;animation:sh 1.2s infinite;border-radius:8px;height:14px}@keyframes sh{to{background-position:-200% 0}}
</style></head><body>
<div id="app"><aside id="side"></aside><main id="view"></main></div><nav class="bot" id="bot"></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const NAV=[['dash','🏠','Dashboard'],['mats','📁','Materials'],['create','✨','New Quiz'],['hist','🕘','History'],['ana','📊','Analytics'],['book','🔖','Bookmarks'],['chat','💬','Ask']];
const MATS=[{n:'Operating Systems.pdf',t:'PDF',s:'4.2 MB',d:'12 Sep',st:'Ready',topics:['Process Management','CPU Scheduling','Deadlocks','Memory Management']},{n:'DBMS Notes.docx',t:'DOCX',s:'1.1 MB',d:'8 Sep',st:'Ready',topics:['Normalization','Transactions','Indexing']},{n:'Networks Lecture.mp4',t:'MP4',s:'86 MB',d:'2 Sep',st:'Processing',topics:[]}];
const QS=[
{q:'Which scheduling algorithm can cause starvation of long processes?',o:['Round Robin','Shortest Job First','FCFS','Multilevel Feedback with aging'],a:1,tp:'CPU Scheduling',df:'Medium',src:'Operating Systems.pdf – Page 27',ex:'SJF always favors short jobs, so a steady stream of short jobs can starve long ones.'},
{q:'Which of these is NOT a necessary condition for deadlock?',o:['Mutual exclusion','Hold and wait','Preemption','Circular wait'],a:2,tp:'Deadlocks',df:'Easy',src:'Operating Systems.pdf – Page 41',ex:'Deadlock requires NO preemption; allowing preemption breaks the condition.'},
{q:'A page fault occurs when a process accesses a page that is not in physical memory.',o:['True','False'],a:0,tp:'Memory Management',df:'Easy',src:'Operating Systems.pdf – Page 63',ex:'The OS must then load the page from disk.'},
{q:'The ___ is a data structure that holds the state of a process.',o:['Page table','Process Control Block','Semaphore','Inode'],a:1,tp:'Process Management',df:'Medium',src:'Source location unavailable',ex:'The PCB stores state, registers, and scheduling info.'},
{q:'What does the Banker\'s algorithm do?',o:['Schedules CPU bursts','Avoids deadlock by checking safe states','Allocates pages','Manages disk queues'],a:1,tp:'Deadlocks',df:'Hard',src:'Operating Systems.pdf – Page 45',ex:'It grants a request only if the system stays in a safe state.'}];
let S={v:'dash',mat:0,cfg:{n:5,df:'Mixed',types:['MCQ','True/False'],topic:'All Topics'},qs:JSON.parse(JSON.stringify(QS)),i:0,ans:{},rev:{},bm:{1:1},t:0,tm:null,hist:[{t:'OS Midterm Practice',s:8,n:10,tm:'12:40',d:'28 Sep'},{t:'DBMS Basics',s:7,n:10,tm:'09:15',d:'24 Sep'},{t:'Networks Quiz',s:4,n:10,tm:'14:02',d:'20 Sep'}],chat:[{r:'a',m:'Hi! Ask me anything about your uploaded material.'}],th:'light'};
try{const t=localStorage.getItem('qg-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function go(v,x){clearInterval(S.tm);Object.assign(S,{v},x||{});render();scrollTo(0,0)}
function theme(){const d=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=d;try{localStorage.setItem('qg-theme',d)}catch(e){}}
function shell(){const on=['gen','prev','play','res'].includes(S.v)?'create':S.v;
$('#side').innerHTML=`<div class="logo">🧠 QuizGen AI</div>`+NAV.map(n=>`<button class="nav ${on==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('')+`<div style="flex:1"></div><button class="nav" onclick="theme()">🌓 Toggle theme</button><button class="nav" onclick="go('home')">← Landing page</button>`;
$('#bot').innerHTML=NAV.filter((_,i)=>[0,1,2,4,6].includes(i)).map(n=>`<button class="${on==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}<br>${n[2]}</button>`).join('');
$('#side').style.display=S.v==='home'?'none':'';$('#bot').style.display=S.v==='home'?'none':''}
const pct=(a,b)=>Math.round(a/b*100);
function ring(p,sz=150){const r=sz/2-10,c=2*Math.PI*r;return `<svg width="${sz}" height="${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="var(--pr)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 ${sz/2} ${sz/2})"/><text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" fill="var(--tx)" font-size="30" font-weight="700">${p}%</text></svg>`}
function line(d){const W=520,H=180,m=d.map((v,i)=>[30+i*(W-50)/(d.length-1),H-20-v*(H-40)/100]);return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><polyline fill="none" stroke="var(--pr)" stroke-width="3" points="${m.map(p=>p.join(',')).join(' ')}"/>${m.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--pr)"><title>${d[i]}%</title></circle>`).join('')}</svg>`}
function bars(rows){return rows.map(r=>`<div style="margin-bottom:12px"><div class="row sp"><span>${r[0]}</span><b style="color:${r[1]<60?'var(--bad)':'inherit'}">${r[1]}%</b></div><div class="bar"><i style="width:${r[1]}%;${r[1]<60?'background:var(--bad)':''}"></i></div></div>`).join('')}
const V={
home(){return `<div class="hero"><span class="badge">AI-powered learning</span><h1>Turn Your Study Material Into Interactive Quizzes</h1><p class="sub" style="max-width:620px;margin:14px auto 24px">Upload your notes, PDFs, presentations, images or lectures and let AI create personalized quizzes from your own material.</p><div class="row" style="justify-content:center"><button class="btn" onclick="go('upload')">Create Your First Quiz</button><button class="btn sec" onclick="go('dash')">Explore Demo</button></div><div class="flow">${['Upload','Analyze','Generate','Practice','Improve'].map((x,i)=>`<span>${i+1}. ${x}</span>`).join('→')}</div></div>
<div class="grid g3">${[['📄','Many file types','PDF, DOCX, PPTX, TXT, images, MP4 and WEBM.'],['🤖','AI generation','Questions built from your own material, with explanations.'],['🎯','Personalized','Weak topics are detected and turned into practice quizzes.'],['📊','Analytics','Track scores, accuracy and activity over time.'],['🔗','Source references','Every question points to its page or timestamp, or says it is unavailable.'],['💬','Ask My Material','Chat with your uploads and get cited answers.']].map(c=>`<div class="card"><div style="font-size:26px">${c[0]}</div><h2>${c[1]}</h2><span class="sub">${c[2]}</span></div>`).join('')}</div>`},
dash(){const avg=Math.round(S.hist.reduce((a,h)=>a+h.s/h.n*100,0)/S.hist.length);return `<h1>Welcome back, Alex 👋</h1><p class="sub">Here is how your learning is going.</p>
<div class="grid g4">${[['Quizzes Completed',S.hist.length+9],['Average Score',avg+'%'],['Questions Answered',184],['Current Streak','6 days 🔥']].map(s=>`<div class="card stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div><br>
<div class="grid g2"><div class="card"><h2>Performance</h2>${line([55,62,58,70,66,78,80])}</div>
<div class="card"><h2>Weak Topics</h2>${bars([['Computer Networks',48],['Memory Management',62]])}<p class="sub" style="margin:0 0 10px">We found a topic that needs more practice.</p><button class="btn sm" onclick="go('create')">Generate Practice Quiz</button></div>
<div class="card"><h2>Recent Quizzes</h2>${S.hist.map(h=>`<div class="row sp" style="padding:6px 0"><span>${h.t}</span><span class="badge">${pct(h.s,h.n)}%</span></div>`).join('')}</div>
<div class="card"><h2>Recommended Practice</h2><div class="row sp"><span>Deadlocks review · 5 Qs</span><button class="btn sm sec" onclick="go('create')">Start</button></div></div></div>`},
mats(){return `<div class="row sp"><div><h1>My Materials</h1><p class="sub">Your uploaded study files.</p></div><button class="btn" onclick="go('upload')">+ Upload</button></div><div class="grid g3">${MATS.map((m,i)=>`<div class="card"><div style="font-size:28px">${m.t=='MP4'?'🎬':'📄'}</div><h2 style="margin:6px 0 2px">${m.n}</h2><div class="sub" style="margin-bottom:8px">${m.t} · ${m.s} · ${m.d}</div><span class="badge ${m.st=='Ready'?'ok':'w'}">${m.st=='Ready'?'✓ Ready':'⏳ Processing'}</span><div class="row" style="margin-top:14px"><button class="btn sm sec" onclick="go('detail',{mat:${i}})">Open</button><button class="btn sm" ${m.st!='Ready'?'disabled':''} onclick="go('create',{mat:${i}})">Create Quiz</button><button class="btn sm sec" onclick="toast('Deleted (demo)')">Delete</button></div></div>`).join('')}</div>`},
upload(){return `<h1>Upload Material</h1><p class="sub">PDF, DOCX, PPTX, TXT, JPG, PNG, MP4, WEBM</p><div class="drop" id="dz" onclick="$('#fi').click()" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();up(event.dataTransfer.files[0])"><div style="font-size:42px">☁️</div><b>Drag &amp; drop your file here</b><div class="sub">or click to browse · max 100 MB</div></div><input id="fi" type="file" hidden onchange="up(this.files[0])"><div id="upst" class="card" style="display:none;margin-top:16px"></div>`},
detail(){const m=MATS[S.mat];return `<h1>${m.n}</h1><p class="sub">${m.t} · ${m.s} · ${m.d}</p><div class="grid g2"><div class="card"><h2>Content summary</h2><div class="row">${[['Topics',m.topics.length],['Concepts',m.topics.length*6],['Potential questions',m.topics.length*14]].map(x=>`<div class="stat" style="flex:1"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div></div><div class="card"><h2>Topics detected</h2>${m.topics.map(t=>`<div>• ${t}</div>`).join('')||'<div class="sk"></div>'}<br><button class="btn" onclick="go('create',{mat:${S.mat}})">Generate Quiz</button></div></div>`},
create(){const c=S.cfg,m=MATS.filter(x=>x.st=='Ready'),ch=(k,v,multi)=>`<button class="chip ${multi?c[k].includes(v):c[k]==v?'on':''}" onclick="cfg('${k}','${v}',${!!multi})">${v}</button>`;
return `<h1>Create Quiz</h1><p class="sub">Configure what the AI should generate.</p><div class="card"><h2>Material</h2><select onchange="S.mat=+this.value;S.cfg.topic='All Topics';render()">${MATS.map((x,i)=>x.st=='Ready'?`<option value="${i}" ${i==S.mat?'selected':''}>${x.n}</option>`:'').join('')}</select><br><br>
<h2>Questions</h2>${[5,10,20,30].map(n=>`<button class="chip ${c.n==n?'on':''}" onclick="S.cfg.n=${n};render()">${n}</button>`).join('')}
<h2>Difficulty</h2>${['Easy','Medium','Hard','Mixed'].map(v=>ch('df',v)).join('')}
<h2>Types</h2>${['MCQ','Multiple Choice','True/False','Fill in the Blank'].map(v=>ch('types',v,1)).join('')}
<h2>Topic</h2>${['All Topics',...MATS[S.mat].topics].map(v=>ch('topic',v)).join('')}
<div style="margin:6px 0 18px">${['Include explanations','Include source references','Avoid duplicate questions'].map(x=>`<label style="display:block"><input type="checkbox" checked> ${x}</label>`).join('')}</div><button class="btn" onclick="gen()">Generate Quiz with AI</button></div>`},
gen(){const st=['Reading content','Identifying topics','Selecting important concepts','Creating questions','Generating explanations','Checking duplicates'];return `<div class="card" style="max-width:520px;margin:50px auto"><h2>Analyzing your material...</h2><div class="bar"><i id="gb" style="width:0"></i></div><br>${st.map((s,i)=>`<div id="gs${i}" style="color:var(--mu);padding:3px 0">○ ${s}</div>`).join('')}</div>`},
prev(){return `<div class="row sp"><div><h1>Quiz Preview</h1><p class="sub">${S.qs.length} questions · review and edit before you start.</p></div><button class="btn" onclick="start()" ${S.qs.length?'':'disabled'}>Start Quiz</button></div>${S.qs.map((q,i)=>`<div class="card" style="margin-bottom:12px"><b>Question ${i+1}</b><p>${q.q}</p>${q.o.map((o,j)=>`<div style="color:${j==q.a?'var(--ok)':'var(--mu)'}">${'ABCD'[j]}. ${o}</div>`).join('')}<div class="row" style="margin:10px 0"><span class="badge">${q.tp}</span><span class="badge w">${q.df}</span><span class="sub" style="margin:0;font-size:13px">📎 ${q.src}</span></div><div class="row"><button class="btn sm sec" onclick="edit(${i})">Edit</button><button class="btn sm sec" onclick="toast('Regenerated (demo)')">Regenerate</button><button class="btn sm sec" onclick="S.qs.splice(${i},1);render()">Delete</button></div></div>`).join('')}`},
play(){const q=S.qs[S.i],m=Math.floor(S.t/60),s=S.t%60;return `<div class="row sp"><b>OS Practice Quiz</b><span class="badge">⏱ ${m}:${String(s).padStart(2,'0')}</span></div><div class="row sp" style="margin:8px 0"><span class="sub" style="margin:0">Question ${S.i+1} / ${S.qs.length}</span><button class="btn sm sec" onclick="S.bm[S.i]=S.bm[S.i]?0:1;toast(S.bm[S.i]?'Bookmarked':'Bookmark removed');render()">${S.bm[S.i]?'🔖 Saved':'🔖 Bookmark'}</button></div><div class="bar"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div><br><div class="card"><h2 style="font-size:19px">${q.q}</h2>${q.o.map((o,j)=>`<button class="opt ${S.ans[S.i]===j?'sel':''}" onclick="S.ans[S.i]=${j};render()"><b>${'ABCD'[j]}.</b> ${o}</button>`).join('')}</div><br><div class="row">${S.qs.map((_,i)=>`<button class="nq ${i==S.i?'cur':''} ${S.rev[i]?'rev':S.ans[i]!==undefined?'ans':''}" onclick="S.i=${i};render()">${i+1}</button>`).join('')}</div><br><div class="row sp"><button class="btn sec" ${S.i?'':'disabled'} onclick="S.i--;render()">Previous</button><button class="btn sec" onclick="S.rev[S.i]=!S.rev[S.i];render()">${S.rev[S.i]?'Unmark':'Mark for Review'}</button>${S.i<S.qs.length-1?`<button class="btn" onclick="S.i++;render()">Next</button>`:`<button class="btn" onclick="submit()">Submit</button>`}</div>`},
res(){const n=S.qs.length,ok=S.qs.filter((q,i)=>S.ans[i]===q.a).length,sk=S.qs.filter((q,i)=>S.ans[i]===undefined).length,tp={};S.qs.forEach((q,i)=>{(tp[q.tp]=tp[q.tp]||[0,0]);tp[q.tp][1]++;if(S.ans[i]===q.a)tp[q.tp][0]++});
return `<h1>Results</h1><div class="grid g2"><div class="card" style="text-align:center">${ring(pct(ok,n))}<div class="row" style="justify-content:center;margin-top:8px"><span class="badge ok">${ok} correct</span><span class="badge" style="color:var(--bad)">${n-ok-sk} incorrect</span><span class="badge w">${sk} skipped</span></div><p class="sub">Time taken ${Math.floor(S.t/60)}m ${S.t%60}s</p></div><div class="card"><h2>Topic performance</h2>${bars(Object.entries(tp).map(([k,v])=>[k,pct(v[0],v[1])]))}</div></div><br><div class="row"><button class="btn" onclick="start()">Retry Quiz</button><button class="btn sec" onclick="go('create')">Practice Weak Areas</button><button class="btn sec" onclick="go('dash')">Back to Dashboard</button></div><h2 style="margin-top:24px">Question review</h2>${S.qs.map((q,i)=>`<div class="card" style="margin-bottom:12px"><b>${i+1}. ${q.q}</b><p style="margin:8px 0">Your answer: <span style="color:${S.ans[i]===q.a?'var(--ok)':'var(--bad)'}">${S.ans[i]===undefined?'Skipped':q.o[S.ans[i]]}</span><br>Correct: <span style="color:var(--ok)">${q.o[q.a]}</span></p><div class="sub" style="margin:0">💡 ${q.ex}</div><div class="row sp" style="margin-top:8px"><span class="sub" style="margin:0;font-size:13px">Source: ${q.src}</span>${q.src.includes('Page')?`<button class="btn sm sec" onclick="toast('Opens the document at this page (demo)')">View Source</button>`:''}</div></div>`).join('')}`},
hist(){return `<h1>Quiz History</h1><p class="sub">Click an attempt to reopen its results.</p><div class="card" style="overflow-x:auto"><table><tr><th>Quiz</th><th>Score</th><th>Accuracy</th><th>Time</th><th>Date</th></tr>${S.hist.map(h=>`<tr style="cursor:pointer" onclick="go('res')"><td>${h.t}</td><td>${h.s}/${h.n}</td><td>${pct(h.s,h.n)}%</td><td>${h.tm}</td><td>${h.d}</td></tr>`).join('')}</table></div>`},
ana(){return `<h1>Analytics</h1><p class="sub">Your progress at a glance.</p><div class="grid g2"><div class="card"><h2>Score over time</h2>${line([55,62,58,70,66,78,80])}</div><div class="card"><h2>Topic performance</h2>${bars([['DBMS',85],['DSA',80],['OS',72],['Networks',48]])}</div><div class="card"><h2>Correct vs incorrect</h2><div class="row" style="justify-content:center">${ring(74,130)}<div><span class="badge ok">136 correct</span><br><br><span class="badge" style="color:var(--bad)">48 incorrect</span></div></div></div><div class="card"><h2>Quiz activity (last 7 days)</h2><div class="row" style="align-items:end;height:130px;gap:10px">${[2,0,3,1,4,2,3].map((v,i)=>`<div style="flex:1;text-align:center"><div style="height:${v*26+4}px;background:linear-gradient(var(--pr2),var(--pr));border-radius:6px 6px 0 0"></div><small class="sub">${'MTWTFSS'[i]}</small></div>`).join('')}</div></div></div>`},
book(){const b=Object.keys(S.bm).filter(k=>S.bm[k]).map(k=>QS[k]);return `<h1>My Bookmarks</h1><p class="sub">Questions you saved for later.</p>${b.length?b.map(q=>`<div class="card" style="margin-bottom:12px"><b>${q.q}</b><div class="row" style="margin:8px 0"><span class="badge">${q.tp}</span><span class="badge w">${q.df}</span><span class="sub" style="margin:0;font-size:13px">📎 ${q.src}</span></div><div class="row"><button class="btn sm" onclick="go('create')">Practice</button><button class="btn sm sec" onclick="S.bm[QS.indexOf(QS.find(x=>x.q==='${q.q.replace(/'/g,"\\'")}'))]=0;render()">Remove</button></div></div>`).join(''):`<div class="card" style="text-align:center;padding:50px">🔖<br>No bookmarks yet. Bookmark questions during a quiz.</div>`}`},
chat(){return `<h1>Ask My Material</h1><p class="sub">Answers come from your uploads, with sources.</p><div class="card"><div id="cm" style="min-height:260px">${S.chat.map(c=>`<div class="msg ${c.r}">${c.m}</div>`).join('')}</div><form onsubmit="ask(event)" class="row"><input id="ci" placeholder="Explain deadlock in simple words" style="flex:1;min-width:0"><button class="btn">Send</button></form></div>`}};
function render(){shell();$('#view').innerHTML=(V[S.v]||V.dash)();}
function cfg(k,v,multi){if(multi){const a=S.cfg[k];a.includes(v)?a.length>1&&a.splice(a.indexOf(v),1):a.push(v)}else S.cfg[k]=v;render()}
function up(f){if(!f)return;const ok=/\.(pdf|docx|pptx|txt|jpe?g|png|mp4|webm)$/i.test(f.name),b=$('#upst');b.style.display='block';
if(!ok){b.innerHTML='❌ Unsupported file. Please upload a PDF, DOCX, PPTX, TXT, image or video.';return}
if(f.size>100*1048576){b.innerHTML='❌ This file is too large (max 100 MB).';return}
let p=0;const t=setInterval(()=>{p=Math.min(100,p+Math.random()*14);b.innerHTML=`<b>${f.name}</b><div class="bar" style="margin:10px 0"><i style="width:${p}%"></i></div>${p<100?`Uploading... ${Math.round(p)}%`:`✓ Uploaded<br>✓ Processing<br>✓ Content analyzed<br><br><button class="btn" onclick="go('mats')">Go to Materials</button>`}`;if(p>=100)clearInterval(t)},250)}
function gen(){go('gen');let i=0;const t=setInterval(()=>{const e=$('#gs'+i);if(!e){clearInterval(t);go('prev',{qs:JSON.parse(JSON.stringify(QS)).slice(0,5)});return}e.textContent='✓ '+e.textContent.slice(2);e.style.color='var(--ok)';i++;$('#gb').style.width=i/6*100+'%'},650)}
function edit(i){const q=S.qs[i],n=prompt('Edit question',q.q);if(n){q.q=n;render()}}
function start(){S.i=0;S.ans={};S.rev={};S.t=0;go('play');S.tm=setInterval(()=>{S.t++;const b=document.querySelector('.badge');if(S.v=='play'&&b)b.textContent='⏱ '+Math.floor(S.t/60)+':'+String(S.t%60).padStart(2,'0')},1000)}
function submit(){const left=S.qs.length-Object.keys(S.ans).length;if(left&&!confirm(left+' unanswered. Submit anyway?'))return;clearInterval(S.tm);go('res')}
function ask(e){e.preventDefault();const i=$('#ci'),m=i.value.trim();if(!m)return;S.chat.push({r:'u',m});S.chat.push({r:'a',m:'<span class="sk" style="display:block;width:160px"></span>'});render();setTimeout(()=>{S.chat.pop();S.chat.push({r:'a',m:'A deadlock is when processes wait on each other forever, each holding a resource another needs.<br><small class="sub">📎 Operating Systems.pdf – Page 41 (demo answer)</small>'});render()},900)}
render();
</script></body></html>
